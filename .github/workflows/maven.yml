name: Stage

on:
  push:
    branches:
      - main

env:
  ALLURE_VERSION: "2.34.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Chrome Installation
        run: google-chrome --version

      - name: Run Selenium + Cucumber Tests
        run: mvn clean test -e
        continue-on-error: true

      # ── DEBUG: confirm results were written ──────────────────────────────
      - name: Debug Test Output
        if: always()
        run: |
          echo "======= allure-results ======="
          ls -la target/allure-results/ 2>/dev/null \
            || echo "❌ MISSING - Allure plugin not writing results"

          echo "======= cucumber-reports ======="
          ls -la target/cucumber-reports/ 2>/dev/null \
            || echo "❌ MISSING - Cucumber HTML/JSON plugin not configured"

          echo "======= surefire-reports ======="
          ls -la target/surefire-reports/ 2>/dev/null \
            || echo "❌ MISSING"
      # ─────────────────────────────────────────────────────────────────────

      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure.tgz -Ls \
            https://github.com/allure-framework/allure2/releases/download/${{ env.ALLURE_VERSION }}/allure-${{ env.ALLURE_VERSION }}.tgz
          sudo tar -zxvf allure.tgz -C /opt/
          sudo ln -s /opt/allure-${{ env.ALLURE_VERSION }}/bin/allure /usr/bin/allure

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate target/allure-results \
            --clean \
            -o target/allure-report

      # ── DEBUG: confirm report was built ──────────────────────────────────
      - name: Debug Allure Report
        if: always()
        run: |
          echo "======= allure-report ======="
          ls -la target/allure-report/ 2>/dev/null \
            || echo "❌ MISSING - allure generate failed"
          echo "======= index.html exists? ======="
          test -f target/allure-report/index.html \
            && echo "✅ YES" || echo "❌ NO"
      # ─────────────────────────────────────────────────────────────────────

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          publish_branch: gh-pages
          destination_dir: allure-report
          force_orphan: true          # ← cleans stale deployments

      - name: Upload Allure Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
          retention-days: 7

      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: warn

      - name: Print Allure Report URL
        if: always()
        run: |
          REPO=$(echo '${{ github.repository }}' | cut -d'/' -f2)
          echo "✅ Allure Report: https://${{ github.repository_owner }}.github.io/${REPO}/allure-report/index.html"
